# datasets.yaml — per-dataset configuration for the STABL cross-language parity benchmark.
#
# Fields:
#   id            : canonical short ID used in filenames and logs
#   zip_path      : path inside data.zip to the dataset root
#   dest_subdir   : subdirectory name under scratch/benchmark/data/
#   py_loader     : stabl.data function name
#   task_type     : binary | regression
#   omics         : list of omic block names (matches Python data_dict keys)
#   has_valid     : true = train+external-validation; false = CV-only
#   outer_cv      : RepeatedStratifiedKFold | GroupShuffleSplit | RepeatedKFold
#   outer_n_splits: n_splits for the outer CV
#   outer_n_repeats: n_repeats (only for Repeated* splitters; omit for GroupShuffleSplit)
#   outer_test_size: test_size (only for GroupShuffleSplit)
#   has_outer_groups: true = patients_id grouping is used
#   artificial_type: knockoff | random_permutation  (Python side; R uses knockoff_equi)
#   stabl_n_bootstraps:
#     lasso: integer
#     alasso: integer
#     en: integer
#   lasso_lambda_grid_logspace: [lo, hi, n]  (C or alpha depending on task)
#   en_lambda_grid_logspace:   [lo, hi, n]
#   alasso_lambda_grid_logspace: [lo, hi, n]
#   stabl_lasso_lambda_grid_logspace: [lo, hi, n]
#   stabl_alasso_lambda_grid_logspace: [lo, hi, n]
#   stabl_en_lambda_grid:      list of alpha/l1_ratio combos
#   col_name_sub:              optional {from: pattern, to: replacement} for column names
#   notes:                     free-text

datasets:

  - id: COVID-19
    zip_path: "COVID-19"
    dest_subdir: "COVID-19"
    py_loader: load_covid_19
    task_type: binary
    omics: [Proteomics]
    has_valid: true
    outer_cv: RepeatedStratifiedKFold
    outer_n_splits: 5
    outer_n_repeats: 20
    has_outer_groups: false   # ids=None for COVID
    artificial_type: knockoff
    stabl_n_bootstraps:
      lasso: 1000
      alasso: 1000
      en: 100
    lasso_lambda_grid_logspace: [-2, 2, 30]   # C (binary = LogisticRegression)
    alasso_lambda_grid_logspace: [-2, 2, 20]
    en_lambda_grid_logspace: [-2, 1, 10]
    stabl_lasso_lambda_grid_logspace: [-2, 0, 10]     # linspace(-0.01, 1, 10) approximated
    stabl_alasso_lambda_grid_logspace: [-2, 1, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.9]
        alpha_logspace: [-2, 1, 5]
    notes: >
      Binary (mild+moderate vs severe COVID). Has external validation (Validation/ dir).
      No outer_groups (ids=None → no group constraint in splitter).
      Lasso STABL lambda_grid uses linspace(0.01,1,10); captured here as logspace approx.

  - id: CFRNA
    zip_path: "CFRNA"
    dest_subdir: "CFRNA"
    py_loader: load_cfrna
    task_type: binary
    omics: [CFRNA]
    has_valid: false
    outer_cv: RepeatedStratifiedKFold
    outer_n_splits: 5
    outer_n_repeats: 20
    has_outer_groups: true
    artificial_type: knockoff
    stabl_n_bootstraps:
      lasso: 1000
      alasso: 1000
      en: 100
    lasso_lambda_grid_logspace: [-2, 2, 30]
    alasso_lambda_grid_logspace: [-2, 2, 20]
    en_lambda_grid_logspace: [-2, 1, 10]
    stabl_lasso_lambda_grid_logspace: [-2, 0, 10]
    stabl_alasso_lambda_grid_logspace: [-2, 1, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.9]
        alpha_logspace: [-2, 1, 5]
    notes: >
      Binary (preeclampsia). CV-only. IDs are sample IDs (not patient groups).
      log2(x+1) transformation applied inside load_cfrna.

  - id: SSI
    zip_path: "Biobank SSI"
    dest_subdir: "Biobank SSI"
    py_loader: load_ssi
    task_type: binary
    omics: [CyTOF, Proteomics]
    has_valid: false
    outer_cv: RepeatedStratifiedKFold
    outer_n_splits: 5
    outer_n_repeats: 20
    has_outer_groups: false   # ids=None for SSI
    artificial_type: knockoff
    stabl_n_bootstraps:
      lasso: 1000
      alasso: 1000
      en: 100
    lasso_lambda_grid_logspace: [-2, 2, 30]
    alasso_lambda_grid_logspace: [-2, 2, 20]
    en_lambda_grid_logspace: [-2, 1, 10]
    stabl_lasso_lambda_grid_logspace: [-2, 0, 10]
    stabl_alasso_lambda_grid_logspace: [-2, 1, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.5]
        alpha_logspace: [-2, 0, 5]
      - l1_ratio: [0.7]
        alpha_logspace: [-2, 0, 5]
      - l1_ratio: [0.9]
        alpha_logspace: [-2, 0, 5]
    notes: >
      Binary (SSI vs control). CV-only. Two omics: CyTOF and Proteomics.
      ids=None so outer_groups is NULL.

  - id: DREAM
    zip_path: "Dream"
    dest_subdir: "Dream"
    py_loader: load_dream
    task_type: binary
    omics: [Phylotype, Taxonomy]
    has_valid: false
    outer_cv: GroupShuffleSplit
    outer_n_splits: 100
    outer_test_size: 0.2
    has_outer_groups: true
    artificial_type: random_permutation
    stabl_n_bootstraps:
      lasso: 1000
      alasso: 1000
      en: 100
    lasso_lambda_grid_logspace: [-3, 0, 30]   # C (binary)
    alasso_lambda_grid_logspace: [-3, 0, 30]
    en_lambda_grid_logspace: [-2, 1, 10]
    stabl_lasso_lambda_grid_logspace: [-2, 0, 10]
    stabl_alasso_lambda_grid_logspace: [-2, 1, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.9]
        alpha_logspace: [-2, 1, 5]
    col_name_sub:
      from: "/"
      to: "_"
    notes: >
      Binary (preterm birth). High-p (16S microbiome). CV-only. GroupShuffleSplit
      outer CV (patient grouping). artificial_type=random_permutation (knockoffs
      infeasible at this p). Column names have "/" replaced with "_".

  - id: OOL-CyPr
    zip_path: "Onset of Labor"
    dest_subdir: "Onset of Labor"
    py_loader: load_onset_of_labor
    task_type: regression
    omics: [CyTOF, Proteomics]
    has_valid: true
    outer_cv: GroupShuffleSplit
    outer_n_splits: 100
    outer_test_size: 0.2
    has_outer_groups: true
    artificial_type: knockoff
    stabl_n_bootstraps:
      lasso: 300
      alasso: 300
      en: 300
    lasso_lambda_grid_logspace: [-2, 2, 30]   # alpha (regression = Lasso/ElasticNet)
    alasso_lambda_grid_logspace: [-2, 2, 30]
    en_lambda_grid_logspace: [-2, 2, 10]
    stabl_lasso_lambda_grid_logspace: [0, 2, 10]
    stabl_alasso_lambda_grid_logspace: [0, 2, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.9]
        alpha_logspace: [0.5, 2, 5]
    notes: >
      Regression (days-of-symptoms). Two omics: CyTOF + Proteomics. Has external
      validation set. GroupShuffleSplit on patient IDs. n_bootstraps=300 for all.

  - id: OOL-CyPrMe
    zip_path: "Onset of Labor"
    dest_subdir: "Onset of Labor"
    py_loader: load_onset_of_labor_cv
    task_type: regression
    omics: [CyTOF, Proteomics, Metabolomics]
    has_valid: false
    outer_cv: GroupShuffleSplit
    outer_n_splits: 100
    outer_test_size: 0.2
    has_outer_groups: true
    artificial_type: knockoff
    stabl_n_bootstraps:
      lasso: 300
      alasso: 300
      en: 300
    lasso_lambda_grid_logspace: [-2, 2, 30]
    alasso_lambda_grid_logspace: [-2, 2, 30]
    en_lambda_grid_logspace: [-2, 2, 10]
    stabl_lasso_lambda_grid_logspace: [0, 2, 10]
    stabl_alasso_lambda_grid_logspace: [0, 2, 10]
    stabl_en_lambda_grid:
      - l1_ratio: [0.9]
        alpha_logspace: [0.5, 2, 5]
    notes: >
      Regression (days-of-symptoms). Three omics: CyTOF + Proteomics + Metabolomics.
      CV-only (no external validation set). Same outer CV as OOL-CyPr.
      Uses load_onset_of_labor_cv (includes Metabolomics, which is missing from
      the on-disk "Onset of Labor/" directory -- must extract from data.zip).
